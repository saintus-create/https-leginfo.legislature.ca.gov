[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leginfo"
version = "1.0.0"
description = "Local, queryable copy of California Legislative Information (statutes + bills)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Public domain data (Cal. Gov. Code § 10248.5); MIT for this code" }

# The pipeline itself is stdlib-only on purpose. Dependencies below are for tests.
[project.optional-dependencies]
dev = ["pytest>=7.4"]
crawl = ["markdownify>=0.11"]

[project.scripts]
leginfo = "leginfo.cli:main"
selfhelp = "selfhelp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
