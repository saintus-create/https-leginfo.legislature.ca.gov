name: probe bulk schema

# Investigates the official LegInfo bulk ZIP on a runner (runners have unrestricted
# egress, unlike a locked-down dev sandbox) and uploads a few-MB schema probe as a
# workflow artifact. Used to keep src/leginfo/parse_bulk.py honest about the real
# column names in pubinfo_<session>.zip.
on:
  workflow_dispatch:
    inputs:
      session_year:
        description: Legislative session start year (odd years, e.g. 2025)
        required: false
        default: "2025"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download official bulk data
        run: |
          url="https://downloads.leginfo.legislature.ca.gov/pubinfo_${{ inputs.session_year }}.zip"
          echo "downloading $url"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/pubinfo.zip" "$url"
          ls -lh "$RUNNER_TEMP/pubinfo.zip"

      - name: Probe archive structure
        run: python3 scripts/probe_bulk.py "$RUNNER_TEMP/pubinfo.zip" probe_out

      - uses: actions/upload-artifact@v4
        with:
          name: bulk-schema-probe-${{ inputs.session_year }}
          path: probe_out
          retention-days: 7
