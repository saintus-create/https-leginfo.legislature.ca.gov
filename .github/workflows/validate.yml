name: Validate legislative corpus

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 0'

permissions:
  contents: read

concurrency:
  group: validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Validate compressed JSONL corpus
        run: node scripts/validate-corpus.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test research orchestrator
        run: bun test tests/orchestrator.test.ts
      - name: Build and verify full corpus artifact
        run: bash scripts/build-site.sh
