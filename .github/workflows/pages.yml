name: Deploy crawlable law corpus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build static HTML corpus
        env:
          PYTHONPATH: src
        run: |
          python -m leginfo export-html \
            --output dist \
            --base-url https://saintus-create.github.io/https-leginfo.legislature.ca.gov
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap-index.xml
          test -s dist/codes/GOV/7921.000.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
