name: Build and deploy AI corpus

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'California legislative session start year'
        required: false
        default: '2025'
        type: string
      upload_corpus:
        description: 'Upload generated Markdown corpus to R2'
        required: false
        default: true
        type: boolean
      deploy_worker:
        description: 'Deploy the Worker after corpus upload'
        required: false
        default: true
        type: boolean
      worker_url:
        description: 'Worker URL for retrieval regression tests (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  LEGINFO_SESSION: ${{ inputs.session || '2025' }}
  R2_BUCKET: r2objectstorage
  AI_SEARCH_INSTANCE: leginfo-search

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build corpus, graph, and site
        run: bash scripts/build-site.sh
      - name: Authenticate Wrangler
        if: ${{ inputs.upload_corpus || inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami
      - name: Upload Markdown corpus to R2
        if: ${{ inputs.upload_corpus }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/upload-autorag-r2.sh autorag
      - name: Provision/check AI Search
        if: ${{ inputs.upload_corpus }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/setup-ai-search.sh
      - name: Deploy Worker
        if: ${{ inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify AI Search directly
        if: ${{ inputs.upload_corpus }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler ai-search search "$AI_SEARCH_INSTANCE" --query 'California statutory section' --max-num-results 5 --reranking --json
      - name: Run retrieval regressions
        if: ${{ inputs.worker_url != '' }}
        env:
          LEGINFO_AI_URL: ${{ inputs.worker_url }}
        run: node scripts/eval-ai-search.mjs
