name = "https-leginfo-legislature-ca-gov"
main = "src/worker.ts"
compatibility_date = "2026-09-13"

[build]
command = "bun run build"

[assets]
directory = "./dist"

[[r2_buckets]]
binding = "R2"
bucket_name = "r2objectstorage"

[ai]
binding = "AI"

# Dedicated legislative D1 database for production deployment
[[d1_databases]]
binding = "LEGINFO_DB"
database_name = "leginfo"
database_id = "YOUR_D1_DATABASE_ID_HERE"
