name = "https-leginfo-legislature-ca-gov"
main = "src/worker.ts"
compatibility_date = "2026-09-13"

[build]
command = "bun run build"

[assets]
directory = "./dist"

[[r2_buckets]]
binding = "R2"
bucket_name = "r2objectstorage"

[ai]
binding = "AI"

[[ai_search]]
binding = "AI_SEARCH"
instance_name = "leginfo-search"
remote = true

[[durable_objects.bindings]]
name = "RESEARCH_SESSIONS"
class_name = "ResearchSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ResearchSession"]
